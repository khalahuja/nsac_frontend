server {
    listen 5173;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Never serve environment files, VCS metadata, or other dotfiles.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service so the browser sees one origin
    # and no CORS preflight is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append, so clients cannot spoof the address used by
        # backend rate limits and registration-abuse controls.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeline and forecast requests over a full lunar day can take a few
        # seconds on a cold cache.
        proxy_read_timeout 120s;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
